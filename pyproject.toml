[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colorspaces"
version = "0.1.0"
description = "Conversions between sRGB, linear RGB, XYZ, and CIELAB"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "emilym557" }]

[tool.setuptools.packages.find]
include = ["colorspaces*"]
